services:
  mysql:
    image: mysql:9.5.0
    container_name: mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - TZ=America/Sao_Paulo
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./data:/var/lib/mysql

  mysql-workbench:
    image: lscr.io/linuxserver/mysql-workbench:latest
    container_name: mysql-workbench
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    ports:
      - 3000:3000 # Acesso HTTP via navegador
      - 3001:3001 # Acesso HTTPS via navegador
    volumes:
      - ./workbench_data:/config # Mantém suas conexões e arquivos salvos
    restart: unless-stopped

networks:
  default:
    name: mysql-net
